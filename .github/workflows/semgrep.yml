name: Semgrep

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1' # Weekly on Monday 8am UTC

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e11487 # v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@713efdd3 # v1
        with:
          config: >-
            p/javascript
            p/typescript
            p/nodejs
            p/security-audit
